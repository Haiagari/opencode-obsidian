name: Test

on:
  push:
    branches: [main]
    paths-ignore:
      - 'wiki/**'
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'wiki/**'
      - '**.md'
      - '.gitignore'
      - 'LICENSE'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Verificar sintaxis bash (core + extensions)
        run: |
          find bin extensions -type f -name '*.sh' -print0 |
            xargs -0 -r -n1 bash -n

      - name: Validar scripts (core + extensions)
        run: bash tests/test_scripts.sh

      - name: Core and optional extension checks
        run: make test

      - name: Verificar archivos esenciales del vault
        run: |
          for f in wiki/hot.md wiki/index.md wiki/log.md PROJECT.md AGENTS.md \
                   BUNKER_RULES.md; do
            [ -f "$f" ] && echo "  ✅ $f" || { echo "  ❌ $f missing"; exit 1; }
          done
